(function render() {
  const root = document.getElementById('groups');
  const frag = document.createDocumentFragment();
  DATA.forEach(g => {
    const sec = document.createElement('div');
    sec.className = 'group'; sec.dataset.name = g.t;
    const h = document.createElement('h2'); h.className = 'group-title';
    const pg = document.createElement('span'); pg.className = 'pg'; pg.textContent = g.p + 'p';
    const tt = document.createElement('span'); tt.className = 'tt'; tt.textContent = g.t;
    const cnt = document.createElement('span'); cnt.className = 'cnt'; cnt.textContent = g.i.length + '장';
    h.append(pg, tt, cnt);
    const grid = document.createElement('div'); grid.className = 'group-grid';
    g.i.forEach(([full, th]) => {
      const c = document.createElement('div'); c.className = 'card';
      c.onclick = () => openModal(encodeURI(full), g.t);
      const img = document.createElement('img'); img.src = encodeURI(th); img.alt = g.t; img.loading = 'lazy';
      c.append(img); grid.append(c);
    });
    sec.append(h, grid); frag.append(sec);
  });
  root.append(frag);
})();
</script>
<script>
function openModal(src, name) {
  document.getElementById('modal-img').src = src;
  document.getElementById('modal-name').textContent = name;
  document.getElementById('modal').classList.add('open');
  document.body.classList.add('modal-open');
}
function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.getElementById('modal-img').src = '';
  document.body.classList.remove('modal-open');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
function filterGroups() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  document.querySelectorAll('.group').forEach(g => {
    const name = g.dataset.name.toLowerCase();
    g.classList.toggle('hidden', q !== '' && !name.includes(q));
  });
  document.getElementById('empty').classList.toggle('hidden', !!document.querySelector('.group:not(.hidden)'));
}
function printImage(e) {
  e.stopPropagation();
  const src = document.getElementById('modal-img').src;
  const pw = window.open('', '_blank');
  if (!pw) {
    // iOS Safari 팝업 차단 시 이미지를 새 탭으로 열기 (공유 → AirPrint 사용)
    const a = document.createElement('a');
    a.href = src;
    a.target = '_blank';
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    return;
  }
  pw.document.write(`<!DOCTYPE html><html><head>
  <meta charset="UTF-8">
  <style>
    @page { size: A4; margin: 8mm; }
    * { margin: 0; padding: 0; }
    html, body { background: white; }
    html, body { margin: 0; padding: 0; }
    /* 원본 비율 그대로, A4(여백 8mm) 안에 맞춤 — 잘리거나 확대되지 않게 */
    img { display: block; margin: 0 auto; width: auto; height: auto; max-width: 193mm; max-height: 278mm; page-break-inside: avoid; break-inside: avoid; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    @media screen { img { max-width: 100vw; max-height: 100vh; } }
    #close-btn { position: fixed; top: 12px; right: 12px; width: 48px; height: 48px; border-radius: 50%; background: rgba(0,0,0,0.5); color: white; font-size: 24px; border: none; cursor: pointer; display: none; align-items: center; justify-content: center; z-index: 9999; }
    @media print { #close-btn { display: none !important; } }
  </style>
  </head><body>
  <button id="close-btn" onclick="window.close()">✕</button>
  <img id="pimg" src="${src}">
  <script>
    var img = document.getElementById('pimg');
    var btn = document.getElementById('close-btn');
    img.onload = function() {
      var s = document.createElement('style');
      var land = this.naturalWidth > this.naturalHeight;
      s.textContent = '@page{size:A4 ' + (land ? 'landscape' : 'portrait') + ';margin:8mm;}' + (land ? '@media print{img{max-width:280mm;max-height:190mm;}}' : '');
      document.head.appendChild(s);
      window.addEventListener('afterprint', function(){ window.close(); });
      window.print();
      btn.style.display = 'flex';
    };
  </scr` + `ipt>
  </body></html>`);
  pw.document.close();
}
</script>
