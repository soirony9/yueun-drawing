<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>인쇄</title>
<style>
  /* 여백 0 → 사파리가 머리글·바닥글을 안 넣음. 종이 크기에 맞추고 안쪽 7mm 여백으로 가장자리 잘림 방지 */
  @page { margin: 0; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: white; }
  body { box-sizing: border-box; padding: 7mm; }
  img { display: block; width: 100%; height: 100%; object-fit: contain; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  #back { position: fixed; top: 16px; left: 16px; padding: 18px 30px; border-radius: 40px; background: #e91e8c; color: white; font-size: 1.6rem; font-weight: 800; border: none; display: none; z-index: 9999; box-shadow: 0 4px 14px rgba(0,0,0,0.25); }
  @media print { #back { display: none !important; } }
</style>
</head>
<body>
<button id="back">← 돌아가기</button>
<img id="pimg" alt="">
<script>
// 도안 목록에서 누르면 이 페이지로 와서 바로 인쇄하고, 끝나면 목록으로 돌아감 (새 탭을 안 열어서 닫을 필요 없음)
var goBack = function () { if (history.length > 1) history.back(); else location.href = './'; };
document.getElementById('back').onclick = goBack;
var src = new URLSearchParams(location.search).get('src');
var img = document.getElementById('pimg');
img.onload = function () {
  var s = document.createElement('style');
  s.textContent = '@page{size:A4 ' + (this.naturalWidth > this.naturalHeight ? 'landscape' : 'portrait') + ';margin:0;}';
  document.head.appendChild(s);
  window.addEventListener('afterprint', goBack);
  var t0 = Date.now();
  window.print();
  // 사파리는 인쇄 화면이 떠 있는 동안 여기서 멈췄다가, 프린트/취소를 누르면 넘어옴 → 바로 돌아가기
  if (Date.now() - t0 > 500) { setTimeout(goBack, 300); return; }
  // 멈추지 않는 경우: 인쇄 화면에서 돌아오는 신호나 화면 터치로 돌아가기
  document.getElementById('back').style.display = 'block';
  setTimeout(function () {
    var away = false;
    window.addEventListener('blur', function () { away = true; });
    window.addEventListener('focus', function () { if (away) goBack(); });
    document.addEventListener('visibilitychange', function () { if (document.hidden) away = true; else if (away) goBack(); });
    document.addEventListener('touchstart', goBack, { once: true });
    document.addEventListener('mousedown', goBack, { once: true });
  }, 600);
};
if (src) img.src = src; else goBack();
</script>
</body>
</html>
